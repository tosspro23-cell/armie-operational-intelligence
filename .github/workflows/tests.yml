name: deterministic-tests

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install controller UI dependencies
        run: python -m pip install -r controller/requirements-ui.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: experiments/openai-agents-sre-local-spike/ui/package-lock.json
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Build local SRE console
        run: npm ci --prefix experiments/openai-agents-sre-local-spike/ui && npm run build --prefix experiments/openai-agents-sre-local-spike/ui
